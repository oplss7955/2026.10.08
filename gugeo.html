const S0={a:{n:"형태소와 단어(품사)",t:[
["형태소 분류",`<b>형태소</b>=의미(실질·문법적 기능)를 가진 최소 단위.<table><tr><th></th><th>실질</th><th>형식</th></tr><tr><th>자립</th><td>체언·관형사·부사·감탄사</td><td>없음</td></tr><tr><th>의존</th><td>용언 어간</td><td>조사·어미·접사</td></tr></table><p>실제 존재하는 형태소는 ①실질·자립 ②형식·의존 ③실질·의존(어간) 3가지뿐.</p><p>예) 가을하늘은 참 높고 푸르다 → 가을/하늘/은/참/높-/-고/푸르-/-다 (8개)</p><div class="tip">💡 띄어 쓸 수 있으면 자립, 단어보다 작으면(어간·어미·접사) 의존. 조사는 단어지만 의존 형태소!</div>`],
["9품사 한눈에",`<table><tr><th>형태</th><th>기능</th><th>품사</th></tr><tr><td rowspan=4>불변어</td><td>체언</td><td>명사·대명사·수사</td></tr><tr><td>수식언</td><td>관형사·부사</td></tr><tr><td>독립언</td><td>감탄사</td></tr><tr><td>관계언</td><td>조사</td></tr><tr><td>가변어</td><td>용언</td><td>동사·형용사</td></tr></table><div class="tip">💡 서술격 조사 '이다'는 조사 중 유일하게 활용(가변어)한다.</div>`],
["명사",`<b>고유 vs 보통</b>: 보통명사는 '-들', 수 관련 말(두·모든·마다), 지시 관형사(이·그·저)와 결합 가능, 고유명사는 불가.<br><b>자립 vs 의존</b>: 의존명사는 관형어가 반드시 필요(것·수·뿐·따름…). 같은 말이 자립/의존으로 쓰이기도 함(뿌리, 그릇).<br><b>유정 vs 무정</b>: 유정은 '에게', 무정은 '에'. 예) 외교부가 일본 정부에(○).<div class="tip">💡 의존명사 종류: 보편성(이·것), 주어성(수·리), 부사성(줄·채·대로), 서술성(따름·뿐), 단위성(명·개)</div>`],
["대명사·수사",`<b>미지칭</b>: 몰라서 못 가리킴(거기 누구세요?). <b>부정칭</b>: 굳이 정하지 않음(누구 없어요?).<br><b>재귀칭</b>: 앞의 3인칭 주어를 되가리킴(자기·저·당신). 1·2인칭 재귀칭은 없음.<br><b>이·그·저</b>: 뒤에 체언을 꾸미면 관형사, 조사가 붙어 주어 등이면 대명사.<br><b>수사</b>: 양수사(하나·둘), 서수사(첫째·제일). '첫째'가 사람을 가리키면 명사.<div class="tip">💡 '저희'는 1인칭 낮춤뿐 아니라 2·3인칭 복수로도 쓰임.</div>`],
["수사 vs 수 관형사 / 명사 vs 수사",`<b>기능</b>으로 구분: 주어·목적어 등이면 수사(다섯이 모였다), 체언을 꾸미면 수 관형사(다섯 사람).<br>'하나'는 수사 외에 명사로도 쓰임(마음을 하나로 모으다, 하나도 즐겁지 않다, 하나의 리모콘).<br>조사 없이 '사과를 하나 먹었다'처럼 부사처럼 보여도 수사.`],
["동사 vs 형용사",`<b>판별법</b>: ①현재형 '-ㄴ-/-는-' 결합 가능=동사 ②관형사형 '-는' 결합 가능=동사 ③명령·청유형, 의도 '-려/-러', 진행 '-고 있다' 가능=동사.<br>늙다(동사)/젊다(형용사), 밝다(날이 밝는다=동사 / 불빛이 밝다=형용사), 크다(키가 큰다=동사/키가 크다=형용사).<br>자다·비다·붐비다·쪼들리다·모자라다=동사, 졸리다=형용사.<div class="tip">💡 잘생기다·못생기다는 동사(원래 형용사였으나 품사 바뀜).</div>`],
["본용언과 보조 용언",`용언 두 개가 이어질 때 뒤가 보조 용언. <b>판별</b>: 중간에 '-서'를 넣어 자연스러우면 본용언+본용언, 어색하면 보조 용언.<br>예) 씻어 먹었다(본) / 깨 먹었다(보조). 읽어 간다·더워 가지고(보조), 나눠 가지는 기쁨(본).<br><b>띄어쓰기</b>: 원칙 띄어 씀, 붙여 쓰기 허용. 단 사이에 조사가 있거나 앞말이 합성동사면 붙여 쓸 수 없음.<br><b>품사</b>: 부정 보조 용언(않다·못하다)은 본용언의 품사를 따름. 그 외(법하다 등)는 고정된 품사.`],
["활용과 불규칙",`활용=어간에 어미가 붙는 것. <b>음운 변동으로 설명되면 규칙</b>(쓰+어→써 'ㅡ'탈락, 놀+는→노는 'ㄹ'탈락).<table><tr><th>구분</th><th>예</th></tr><tr><td>어간 바뀜</td><td>ㅅ(짓+어→지어), ㄷ(듣+어→들어), ㅂ(돕+아→도와), 우(푸+어→퍼), 르(흐르+어→흘러)</td></tr><tr><td>어미 바뀜</td><td>여(공부하+어→공부하여), 러(이르러, 푸르러), 오(달+아라→다오)</td></tr><tr><td>둘 다</td><td>ㅎ(파랗+아→파래)</td></tr></table><div class="tip">💡 이르다(말하다)→일러(르 불규칙), 이르다(도착하다)→이르러(러 불규칙). 누르다(힘을 가하다)→눌러, 누르다(빛깔)→누르러.</div>`],
["관형사·부사",`<b>관형사</b>: 활용 X, 조사 X, 체언 수식. 성상(옛·헌·새)/지시(이·그·저)/수(한·두·모든). 겹칠 땐 지시-수-성상 순.<br>'다른': 형용사(저것과 다른 물건)/관형사(다른 사람들) → '딴'으로 바꿔 보아 되면 관형사.<br><b>부사</b>: 성분 부사(성상·지시·부정·상징)와 문장 부사(양태·접속). 문장 부사는 자리 이동이 자유롭고 서술어로 풀 수 있음(확실히→확실하다).<br>체언을 꾸미는 부사: 바로, 아주, 한갓, 겨우, 다만, 고작, 단지.`],
["조사",`<b>격 조사</b>: 주격(이/가·께서·에서), 목적격(을/를), 관형격(의), 부사격(에·에게·로·와·보다 등), 보격(되다·아니다 앞 이/가), 서술격(이다), 호격(아·야).<br><b>보조사</b>: 뜻을 더하며 생략하면 의미가 달라짐(너만/너도). 격조사는 생략 가능.<br><b>와/과</b>: 두 문장으로 쪼개지면 접속 조사, 안 쪼개지면 부사격(함께·같이). 접속 조사는 자리 이동 불가.<div class="tip">💡 '이/가'는 새 정보·'누가' 대답, '은/는'은 이미 나온 것·대조·소개.</div>`],
["단어의 형성",`<b>단일어</b>=어근 하나. <b>복합어</b>=파생어(어근+접사)·합성어(어근+어근).<br>접사 판별: 둘로 나눴을 때 한 덩어리가 접사면 파생어(비웃음=비웃+음). 접사처럼 보여도 떨어져 나오지 않으면 합성어(코웃음=코+웃음).<br>접미사는 품사를 바꿀 수 있음(먹보). 전성 어미는 품사를 바꾸지 못함(달리기: 관형어 수식=명사 파생, 빨리 달리기=동사+명사형어미). 접두사 중 예외적으로 품사를 바꾸는 것: 메-, 강-, 엇-, 올-, 헛-(메마르다 등).<br><b>합성어</b>: 대등(논밭)/종속(돌다리)/융합(밤낮, 돌아가다=죽다). <b>통사적</b>(배열이 일반적: 첫사랑·돌아가다) vs <b>비통사적</b>(검붉다·늦더위·덮밥).<div class="tip">💡 날고기=파생(날-접두사), 날짐승=합성(날다의 어간), 군말=파생, 군밤=합성.</div>`]]},
b:{n:"중세 국어",t:[
["표기 방식",`<b>이어 적기(연철)</b>: 형태소를 소리 나는 대로 이어 적음(집+이→지비). <b>끊어 적기</b>: 형태소를 분리해 적음(근대 이후 확대). <b>거듭 적기</b>: 근대에 나타난 과도기 방식(앞 음절 종성+뒤 음절 초성 모두 표기).<br><b>8종성법</b>: 음절 끝에는 ㄱㄴㄷㄹㅁㅂㅅㅇ(ㆁ)만 발음. 15세기에는 ㄷ과 ㅅ이 구별됨.<br><b>방점</b>: 평성(점 없음)·거성(1점)·상성(2점).`],
["문자와 음운",`현대에 없는 문자: ㅿ(반치음)·ㅸ(순경음 ㅂ)·ㆆ·ㆁ·ㆍ(아래아).<br><b>병서</b>: 합용 병서(ㅳ·ㅄ은 각 자음이 모두 발음)·각자 병서(서로 같은 자음).<br><b>제자 원리</b>: 초성 기본자(ㄱㄴㅁㅅㅇ)→가획자(ㅋ,ㄷㅌ,ㅂㅍ,ㅈㅊ,ㆆㅎ)→이체자(ㆁ,ㄹ,ㅿ: 가획 아님). 모음은 ㆍ,ㅡ,ㅣ 기본자의 결합(초출자·재출자). 종성은 초성 글자를 다시 씀.<br>모음조화: 양성(ㅏㅗㆍ) 음성(ㅓㅜㅡ) 중성(ㅣ). 두음 법칙·구개음화는 15세기에는 없었음(니르다, 모딘).`],
["조사",`<b>주격</b>: 이(자음 뒤)/ㅣ(모음 뒤)/Ø. <b>목적격</b>: 을·를·ᄋᆞᆯ·ᄅᆞᆯ(모음조화: 양성 ᄋᆞᆯ·ᄅᆞᆯ, 음성 을·를). <b>관형격</b>: 사람·동물 중 양성 ᄋᆡ, 음성 의 / 높임 대상·무정물 ㅅ. <b>부사격</b>: 애/에/예(장소), 의/ᄋᆡ(유정물). <b>호격</b>: 아, 하(높임). 보조사 '은/는' 계열이 이미 있었음.<div class="tip">💡 관형격 구분: 높임·무정물=ㅅ, 그 외 사람·동물은 모음조화에 따라 ᄋᆡ/의.</div>`],
["높임 표현",`<b>주체 높임</b>: -시-(-샤-). <b>객체 높임</b>: -숩-/-줍-/-ᅀᆞᆸ-(목적어·부사어 대상을 높임). <b>상대 높임</b>: -ᅌᅵ-/-이-. 높임 어휘(진지 등)도 사용. 현대 국어에는 객체 높임 선어말 어미가 없음(여쭙다 같은 어휘로 실현).`],
["의문문",`<b>판정 의문문</b>(가부): -ㅏ/-녀 계열(가). <b>설명 의문문</b>(구체적 설명, 의문사): -고/-뇨. 주어가 <b>2인칭</b>이면 판정·설명 구분 없이 '-ㄴ다'. 보조사 '고/구'가 대명사와 굳어 '누고→누구'가 됨(체언+보조사 → 새 단어).`]]}};
const Q0={a:[
["'가을하늘은 참 높다'의 형태소 수는?",["4","5","6","7"],2,"가을/하늘/은/참/높-/-다 = 6개. 복합어도 형태소 단위로 쪼갭니다.","어간·어미·조사를 각각 센다.",0],
["'하늘은 참 높고 푸르다'에서 '높-'의 성격은?",["실질·자립","실질·의존","형식·의존","형식·자립"],1,"용언 어간은 구체적 의미가 있으나(실질) 혼자 쓰이지 못해(의존) 실질·의존 형태소.","'형식·자립'은 존재하지 않는다.",1],
["고유 명사의 특징으로 옳은 것은?",["'-들'과 결합하기 어렵다","'모든'과 자연스럽게 결합한다","'이·그·저'와 흔히 결합한다","동일 이름이 둘 이상 존재한다"],0,"고유 명사는 하나뿐인 대상이므로 복수 접미사 '-들', 수 관련 말, 지시 관형사와 잘 결합하지 않는다.","보통 명사 = 둘 이상 존재.",1],

["어미의 종류",`어미는 <b>어말 어미</b>(맨 끝)와 <b>선어말 어미</b>(그 앞, 몇 개든)로 나뉜다. 예) 가+시+었+다(어간·선어말·선어말·어말), 바쁘+시+ㄴ 선생님.<br><b>선어말</b>: 주체 높임 -시-, 시제(현재 -는-/-ㄴ-, 과거 -았-/-었-, 미래·추측 -겠-, 회상 -더-), 공손 -옵-.<br><b>종결</b>: 평서(-다)·의문(-느냐/-니)·명령(-아라/-어라)·청유(-자)·감탄(-구나).<br><b>연결</b>: 대등(-고·-(으)며·-(으)나·-지만), 종속(-아서·-(으)니까 등), 보조적(-아/어·-게·-지·-고).<br><b>전성</b>: 명사형(-(으)ㅁ·-기), 관형사형(-(으)ㄴ·-는·-(으)ㄹ·-던), 부사형(-게·-도록·-듯이).<div class="tip">💡 전성 어미는 접사가 아니다 → 단어의 품사를 바꾸지 못하고 용언 그대로.</div>`],
["접사 vs 전성 어미",`<b>접두사</b>: 헛-·겉-·들-·풋-·새-·군-. <b>접미사</b>: -꾸러기·-꾼·-하-·-되-·-롭-·-이-·-히-·-기-·-리-·-우-·-구-·-추-.<br>접미사의 품사 변화는 직접 확인(잠보 명→명, 먹보 동→명). 명사 파생 -(으)ㅁ·-기·-이(꿈·달리기·놀이), 부사 파생 -이·-히(높이·솔직히), 용언 파생 -하-(건강하다 형, 공부하다 동).<br>피동 접사: 품사 불변·문법 성질만 변화. 사동 접사: 품사를 바꾸기도 함(넓다 형→넓히다 동, 낮다→낮추다).<br><b>구별(-음/-기)</b>: 앞에 관형어가 오면 명사(접사), 부사어가 오면 동사·형용사(전성 어미). 예) 하는 달리기=명사, 빨리 달리기=동사. 뚜렷이=부사 파생, 뚜렷하게=형용사+부사형 어미.<div class="tip">💡 접두사 중 예외로 품사를 바꾸는 것: 메-·강-·엇-·올-·헛-·좀-(메마르다 등: 동사 어간→형용사).</div>`],
["파생어·합성어 구별 총정리",`<b>방법</b>: 둘로 나눠 접사가 나오면 파생어, 어근+어근이면 합성어(직접 구성 성분 분석). 단팥죽=단+팥죽(어근+어근).<table><tr><th>파생어</th><th>합성어</th></tr><tr><td>날고기(날-: 익히지 않은)</td><td>날짐승(날다의 어간)</td></tr><tr><td>돌배(돌-: 야생)</td><td>돌다리(돌=stone)</td></tr><tr><td>새까맣다(새-: 매우)</td><td>새신랑(관형사 새)</td></tr><tr><td>맛나다(형용사)</td><td>빛나다(동사)</td></tr><tr><td>군살·군말(군-: 쓸데없는)</td><td>군밤(굽+은+밤)</td></tr><tr><td>울보·웃음보(-보)</td><td>식탁보(보자기)</td></tr></table><b>합성어 분류</b>: 대등(논밭·여닫다)·종속(돌다리·갈아입다)·융합(입방아·벼락부자·돌아가다=죽다). 밤낮·피땀은 대등/융합 둘 다 가능. 두 용언 사이에 '-고'가 되면 대등, '-아/어'가 되면 종속.<br><b>통사적</b>: 체언+체언(밤낮), 관형사+체언(첫사랑), 용언 관형사형+체언(검은색), 연결형+용언(돌아가다), 부사+용언(잘되다). <b>비통사적</b>: 어간+체언(늦더위)·어간+용언(굶주리다)·부사+체언(척척박사).`],
["불규칙 판별과 규칙 활용",`<b>모음 어미를 붙여 보기</b>: 돕+고→돕고(변화 없음) / 돕+아서→도와서(ㅂ 불규칙). 긋+다가→긋다가 / 긋+어서→그어서(ㅅ 불규칙). 이르+겠다 / 이르+어서→이르러서(러 불규칙).<br><b>규칙 활용</b>(음운 변동으로 설명): 쓰+어→써(ㅡ 탈락), 치르+어→치러(ㅡ 탈락), 놀+는→노는(ㄹ 탈락). 벗다·씻다·웃다·입다·좁다는 규칙(벗어·좁아).<br><b>ㅂ</b>: 돕다·곱다·눕다·굽다 / <b>ㅅ</b>: 짓다·긋다·잇다·젓다 / <b>ㄷ</b>: 듣다·묻다(問)·걷다(步).<div class="tip">💡 같은 기본형도 뜻에 따라 다르다: 이르다(말하다)→일러, 이르다(도착)→이르러. 묻다(問)→물어(ㄷ 불규칙)/묻다(埋)→묻어(규칙).</div>`]);

["접사 모음",`<b>접두사</b>: 헛-(헛걸음·헛고생), 겉-(겉치레·겉멋), 들-(들볶다·들끓다), 풋-(풋사과·풋사랑), 군-(군살·군말), 새-(새까맣다·'매우'), 날-(날고기), 돌-(돌배), 맨-(맨손), 덧-(덧신), 시-(시퍼렇다), 짓-(짓밟다), 치-(치솟다).<br><b>품사를 바꾸는 접두사</b>(동사 어간→형용사): 메-·강-·숫-·암-·엇-·올-·좀-·헛-·걸-·알- 예) 메마르다·강마르다·엇되다·헛되다·걸맞다·알맞다.<br><b>명사 파생 접미사</b>: -꾸러기(잠꾸러기), -꾼(구경꾼), -보(울보·먹보), -질(가위질), -개(덮개), -쟁이(멋쟁이), -(으)ㅁ·-기·-이(꿈·달리기·놀이).<br><b>부사 파생</b>: -이·-히(높이·솔직히). <b>용언 파생</b>: -하-(공부하다 동사·건강하다 형용사), -롭-(새롭다), -스럽-(자랑스럽다), -답-(학생답다).<br><b>피동</b>: -이-·-히-·-리-·-기-(보이다·먹히다·들리다·안기다). <b>사동</b>: -이-·-히-·-리-·-기-·-우-·-구-·-추-(먹이다·넓히다·울리다·웃기다·깨우다·달구다·낮추다).<div class="tip">💡 피동 접미사는 품사를 바꾸지 않고 문법 성질만 바꾼다. 사동 접미사는 형용사→동사처럼 품사를 바꾸기도 한다(넓다→넓히다).</div>`],
["불규칙 활용 모음",`<table><tr><th>구분</th><th>변화</th><th>예</th></tr><tr><td colspan=3><b>어간이 바뀜</b></td></tr><tr><td>ㅅ</td><td>ㅅ 탈락</td><td>짓다·잇다·긋다·젓다·낫다 (지어·이어)</td></tr><tr><td>ㄷ</td><td>ㄷ→ㄹ</td><td>듣다·묻다(問)·걷다(步)·깨닫다 (들어·물어)</td></tr><tr><td>ㅂ</td><td>ㅂ→오/우</td><td>돕다·곱다·눕다·굽다·덥다 (도와·구워)</td></tr><tr><td>우</td><td>우 탈락</td><td>푸다 (퍼) — 유일</td></tr><tr><td>르</td><td>르→ㄹㄹ</td><td>흐르다·부르다·빠르다·누르다(힘줌) (흘러·눌러)</td></tr><tr><td colspan=3><b>어미가 바뀜</b></td></tr><tr><td>여</td><td>-어→-여</td><td>하다·공부하다 — '하다'계열</td></tr><tr><td>러</td><td>-어→-러</td><td>이르다(도착)·푸르다·누르다(빛깔)·노르다</td></tr><tr><td>오</td><td>-아라→-오</td><td>달다(주다): 다오 — 유일</td></tr><tr><td colspan=3><b>둘 다 바뀜</b></td></tr><tr><td>ㅎ</td><td>ㅎ 탈락+어미 변화</td><td>파랗다·하얗다·노랗다·동그랗다 (파래·하얘)</td></tr></table><div class="tip">💡 규칙 활용: 입다·잡다·좁다·벗다·씻다·웃다·믿다·받다·닫다·좋다·놓다·쌓다. 쓰+어→써(ㅡ 탈락), 놀+는→노는(ㄹ 탈락)은 음운 변동이라 규칙.</div>`],
["합성어 유형 모음",`<b>의미 관계</b>: 대등(논밭·여닫다·오르내리다) / 종속(돌다리·갈아입다·뛰놀다) / 융합(입방아·벼락부자·돌아가다=죽다·개미허리·피땀(비유)).<table><tr><th>통사적 합성어</th><th>예</th></tr><tr><td>체언+체언</td><td>가래떡·거짓말·돌다리·밤낮·우리나라</td></tr><tr><td>관형사+체언</td><td>새색시·아무것·옛말·첫사랑</td></tr><tr><td>용언 명사형+체언</td><td>갈림길·따개칼·맺음말</td></tr><tr><td>용언 관형사형+체언</td><td>검은색·묵은땅·미친개</td></tr><tr><td>용언 연결형+용언</td><td>내려다보다·돌아가다·알아듣다</td></tr><tr><td>체언+용언</td><td>남다르다·마음먹다·앞두다·잠들다</td></tr><tr><td>부사+용언</td><td>가만있다·못되다·잘되다</td></tr><tr><td>부사+부사</td><td>곧잘·또다시·오래오래</td></tr></table><table><tr><th>비통사적 합성어</th><th>예</th></tr><tr><td>용언 어간+체언</td><td>검버섯·늦더위·덮밥·붉돔·싫증</td></tr><tr><td>용언 어간+용언</td><td>굶주리다·날뛰다·보살피다·오르내리다·헐벗다</td></tr><tr><td>부사+체언</td><td>거듭제곱·척척박사</td></tr><tr><td>연결형+체언</td><td>섞어찌개·살아생전</td></tr><tr><td>종결형+체언</td><td>먹자골목·싸구려판</td></tr></table>`],
["어미 모음",`<b>선어말</b>: 주체 높임 -시-, 시제(현재 -는-/-ㄴ-, 과거 -았-/-었-, 미래·추측 -겠-, 회상 -더-), 공손 -옵-, 상대 높임 -ㅂ-.<table><tr><th>어말 어미</th><th>종류</th></tr><tr><td>종결</td><td>평서 -다·-네·-ㅂ니다 / 의문 -느냐·-는가·-ㅂ니까 / 감탄 -구나 / 명령 -아라·-게·-십시오 / 청유 -자·-세·-ㅂ시다</td></tr><tr><td>연결</td><td>대등(나열 -고·-며, 대조 -나·-지만, 선택 -거나) / 종속(-아서·-니까 등) / 보조적(-아/어·-게·-지·-고)</td></tr><tr><td>전성</td><td>명사형 -(으)ㅁ·-기 / 관형사형 -(으)ㄴ·-는·-(으)ㄹ·-던 / 부사형 -게·-도록·-듯이</td></tr></table><div class="tip">💡 어미(전성 어미 포함)는 품사를 바꾸지 못한다. 품사를 바꾸는 것은 접사뿐.</div>`],
["중세 국어 한눈 정리",`<table><tr><th>구분</th><th>내용</th></tr><tr><td>표기</td><td>이어 적기, 8종성법(ㄷ·ㅅ 구별), 방점(평 0·거 1·상 2), 합용·각자 병서</td></tr><tr><td>문자·음운</td><td>ㅿ·ㅸ·ㆆ·ㆁ·ㆍ 사용, 모음조화, 구개음화·두음 법칙 없음</td></tr><tr><td>주격</td><td>이(자음 뒤)/ㅣ(모음 뒤)/Ø</td></tr><tr><td>목적격</td><td>ᄋᆞᆯ·ᄅᆞᆯ(양성) / 을·를(음성)</td></tr><tr><td>관형격</td><td>ᄋᆡ(양성)·의(음성): 사람·동물 / ㅅ: 높임 대상·무정물</td></tr><tr><td>부사격·호격</td><td>애/에/예(장소), 의/ᄋᆡ(유정물) / 아·하(높임)</td></tr><tr><td>높임</td><td>주체 -시-(-샤-), 객체 -숩-·-줍-·-ᅀᆞᆸ-, 상대 -ᅌᅵ-·-이-</td></tr><tr><td>의문문</td><td>판정 -가/-녀, 설명 -고/-뇨, 2인칭 주어 -ㄴ다</td></tr><tr><td>ㅎ 종성 체언</td><td>모음 조사: 이어 적기 / ㄱ·ㄷ 조사: ㅋ·ㅌ으로 축약 / ㅅ: ㅎ 안 나타남</td></tr><tr><td>ㅸ·ㅿ</td><td>소실되어 현대 ㅂ·ㅅ 불규칙 활용(돕다·짓다 등)이 생김</td></tr></table>`]];
function finalPage(){h(`<button onclick="home()">← 홈</button><h1>📌 최종정리</h1><div class="card">${F.map((x,i)=>`<button onclick="fTopic(${i})">${x[0]}</button>`).join("")}</div>`)}

ld();home();
